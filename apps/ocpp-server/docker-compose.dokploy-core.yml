services:
  citrine-core:
    build:
      context: ../..
      dockerfile: ./apps/ocpp-server/deploy.Dockerfile.ir
      args:
        COMMIT_SHA: ${COMMIT_SHA}
    # Supply the complete reviewed schema-backed environment, including auth and hooks.
    # Paths are resolved relative to this Compose file.
    env_file:
      - ${CORE_ENV_FILE:?Set CORE_ENV_FILE to the reviewed Core environment file}
    environment:
      # Offline migrations and partition provisioning must finish before runtime.
      DB_STRATEGY: none
    expose:
      - "8080"
      - "8081"
      - "8082"
      - "8092"
      - "8443"
      - "8444"
      - "9229"
      - "10000-10500"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net');const c=net.createConnection(Number(process.env.CITRINEOS_PORT || 8080),'127.0.0.1',()=>{c.end();process.exit(0)});c.on('error',()=>process.exit(1));c.setTimeout(5000,()=>{c.destroy();process.exit(1)});\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
