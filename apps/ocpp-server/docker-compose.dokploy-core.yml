services:
  citrine-core:
    build:
      context: ../..
      dockerfile: ./apps/ocpp-server/deploy.Dockerfile.ir
      args:
        COMMIT_SHA: ${COMMIT_SHA}
    environment:
      CITRINEOS_HOST: 0.0.0.0
      CITRINEOS_SWAGGER_LOGOPATH: /usr/local/apps/citrineos/apps/ocpp-server/dist/assets/logo.png
      CITRINEOS_FILEACCESS_LOCAL_DEFAULTFILEPATH: /usr/local/apps/citrineos/apps/ocpp-server/dist/assets
      CITRINEOS_CACHE_TYPE: redis
      APP_NAME: ${APP_NAME:-all}
      DB_STRATEGY: ${DB_STRATEGY:-migrate}
      CITRINEOS_DATABASE_HOST: ${BOOTSTRAP_CITRINEOS_DATABASE_HOST}
      CITRINEOS_DATABASE_PORT: ${BOOTSTRAP_CITRINEOS_DATABASE_PORT:-5432}
      CITRINEOS_DATABASE_DATABASE: ${BOOTSTRAP_CITRINEOS_DATABASE_NAME:-citrine}
      CITRINEOS_DATABASE_USERNAME: ${BOOTSTRAP_CITRINEOS_DATABASE_USERNAME}
      CITRINEOS_DATABASE_PASSWORD: ${BOOTSTRAP_CITRINEOS_DATABASE_PASSWORD}
      CITRINEOS_FILEACCESS_TYPE: ${BOOTSTRAP_CITRINEOS_FILE_ACCESS_TYPE:-s3}
      CITRINEOS_FILEACCESS_S3_REGION: ${BOOTSTRAP_CITRINEOS_FILE_ACCESS_S3_REGION:-us-east-1}
      CITRINEOS_FILEACCESS_S3_ENDPOINT: ${BOOTSTRAP_CITRINEOS_FILE_ACCESS_S3_ENDPOINT}
      CITRINEOS_FILEACCESS_S3_DEFAULTBUCKETNAME: ${BOOTSTRAP_CITRINEOS_FILE_ACCESS_S3_DEFAULT_BUCKET_NAME:-citrineos-s3-bucket}
      CITRINEOS_FILEACCESS_S3_S3FORCEPATHSTYLE: ${BOOTSTRAP_CITRINEOS_FILE_ACCESS_S3_FORCE_PATH_STYLE:-true}
      CITRINEOS_FILEACCESS_S3_ACCESSKEYID: ${BOOTSTRAP_CITRINEOS_FILE_ACCESS_S3_ACCESS_KEY_ID}
      CITRINEOS_FILEACCESS_S3_SECRETACCESSKEY: ${BOOTSTRAP_CITRINEOS_FILE_ACCESS_S3_SECRET_ACCESS_KEY}
      CITRINEOS_MESSAGEBROKER_AMQP_URL: ${CITRINEOS_UTIL_MESSAGEBROKER_AMQP_URL}
      CITRINEOS_CACHE_URL: ${CITRINEOS_UTIL_CACHE_REDIS_URL}
    expose:
      - "8080"
      - "8081"
      - "8082"
      - "8092"
      - "8443"
      - "8444"
      - "9229"
      - "10000-10500"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net');const c=net.createConnection(8080,'127.0.0.1',()=>{c.end();process.exit(0)});c.on('error',()=>process.exit(1));c.setTimeout(5000,()=>{c.destroy();process.exit(1)});\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
