name: Upstream adoption policy review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate policy-only diff with the previously accepted checker
        run: |
          git show origin/dev:.release/release.py > "$RUNNER_TEMP/accepted-release-policy.py"
          python3 "$RUNNER_TEMP/accepted-release-policy.py" check --base origin/dev
      - name: Test new policy safeguards
        run: python3 -B -m unittest discover -s .release/tests -v
