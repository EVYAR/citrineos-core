name: Operator PR acceptance
on:
  pull_request:
    paths:
      - 'apps/operator-ui/**'
      - 'packages/base/**'
      - 'packages/types/**'
      - 'scripts/validate-operator-*.mjs'
      - 'scripts/ci/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/unit-tests.yml'
      - '.github/workflows/coordinated-operator-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operator:
    uses: ./.github/workflows/coordinated-operator-build.yml
