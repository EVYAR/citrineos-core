name: REUSE License Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  reuse-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Establish hosted guard
        run: python3 scripts/ci/bounded.py init

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install REUSE tool
        run: python3 scripts/ci/bounded.py run --stage reuse-install --profile stdlib -- pip install reuse

      - name: Run existing REUSE ignore policy under the guard
        run: python3 scripts/ci/bounded.py run --stage reuse --profile stdlib -- bash scripts/ci/reuse-check.sh

      - name: Clean up temporary files
        if: always()
        run: |
          if [ -f reuse_output.txt ]; then cp reuse_output.txt reports/ci/reuse-output.log; fi
          rm -f reuse_output.txt failing_files.txt unignored_failures.txt

      - name: Release owned guard resources
        if: always()
        run: python3 scripts/ci/bounded.py cleanup

      - name: Retain native guard logs and measurements
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-check-evidence-${{ github.sha }}
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 7
